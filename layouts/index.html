{{ define "main" }}
<header class="hero">
    <p class="lede">Post-Punk, Shoegaze and Dark Synthwave from New Zealand</p>
    <p class="actions">
        <a class="button" href="{{ "music/" | relURL }}">Listen Now</a>
        <a class="button button-ghost" href="{{ "shows/" | relURL }}">Upcoming Shows</a>
    </p>
    <figure class="triptych">
        <img src="{{ "images/John.png" | relURL }}" alt="John Mason performing">
        <img src="{{ "images/johnmcd.png" | relURL }}" alt="John McDermott performing">
        <img src="{{ "images/hannah.png" | relURL }}" alt="Hannah Berry performing">
    </figure>
    <p class="credit">
        Photos by
        <a href="https://www.instagram.com/rileycochrane_/" target="_blank" rel="noopener noreferrer">@rileycochrane_</a>
    </p>
</header>
{{ end }}
